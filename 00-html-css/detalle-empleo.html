<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Consulta los detalles de esta oportunidad laboral en DevJobs.">
        <meta name="referrer" content="strict-origin-when-cross-origin">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https://api.github.com; form-action 'self'">
        <title>Detalle del empleo | DevJobs</title>
        <link rel="stylesheet" href="./css/busqueda.css">
        <link rel="stylesheet" href="./css/detalle-empleo.css">
        <link rel="stylesheet" href="./css/profile.css">
        <script type="module" src="./js/detalle-empleo.js"></script>
    </head>
    <body>
        <!-- Navegación principal, compartida con la página de empleos. -->
        <header class="navbar">
            <a class="brand" href="index.html" aria-label="DevJobs, página de inicio">
                <span class="brand-icon" aria-hidden="true">⚙</span>
                <span>DevJobs</span>
            </a>
            <nav aria-label="Navegación principal">
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="busqueda.html" class="active">Empleos</a></li>
                    <li><a href="busqueda.html">Empresas</a></li>
                    <li><a href="busqueda.html">Salarios</a></li>
                </ul>
            </nav>
            <details class="profile-menu">
                <summary class="profile-trigger" aria-label="Abrir opciones del avatar">
                    <span class="avatar-fallback" data-avatar-fallback aria-hidden="true">JD</span>
                    <img class="profile-avatar" data-avatar-image alt="" hidden>
                    <span class="profile-trigger-label">Mi perfil</span>
                </summary>
                <form class="profile-panel" data-avatar-form>
                    <h2>Personaliza tu avatar</h2>
                    <label for="profile-name">Nombre para mostrar</label>
                    <input id="profile-name" name="profileName" type="text" maxlength="40" autocomplete="nickname" value="Mi perfil">

                    <label for="avatar-source">Fuente del avatar</label>
                    <select id="avatar-source" name="avatarSource">
                        <option value="github">GitHub</option>
                        <option value="url">URL de imagen HTTPS</option>
                        <option value="upload">Subir imagen</option>
                    </select>

                    <div data-avatar-source="github">
                        <label for="github-username">Usuario público de GitHub</label>
                        <input id="github-username" name="githubUsername" type="text" maxlength="39" autocomplete="off" placeholder="octocat">
                    </div>
                    <div data-avatar-source="url" hidden>
                        <label for="avatar-url">URL de imagen (HTTPS)</label>
                        <input id="avatar-url" name="avatarUrl" type="url" maxlength="2048" autocomplete="url" placeholder="https://ejemplo.com/avatar.jpg">
                    </div>
                    <div data-avatar-source="upload" hidden>
                        <label for="avatar-file">Imagen PNG, JPEG o WebP (máx. 1.5 MB)</label>
                        <input id="avatar-file" name="avatarFile" type="file" accept="image/png,image/jpeg,image/webp">
                    </div>

                    <p class="profile-note">Se guarda solo en este navegador. GitHub usa el avatar público; no inicia sesión.</p>
                    <p class="profile-status" data-avatar-status role="status" aria-live="polite"></p>
                    <div class="profile-actions">
                        <button type="submit">Guardar avatar</button>
                        <button type="button" data-avatar-reset>Restablecer</button>
                    </div>
                </form>
            </details>
        </header>

        <!-- JavaScript completa esta sección con el empleo elegido en la búsqueda. -->
        <main class="job-detail-page">
            <nav class="breadcrumbs" aria-label="Ruta de navegación">
                <a href="busqueda.html">Empleos</a>
                <span aria-hidden="true">›</span>
                <span id="breadcrumb-title">Detalle del empleo</span>
            </nav>

            <section id="job-detail" class="job-detail" aria-live="polite">
                <p class="loading-message">Cargando información del empleo...</p>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 DevJobs. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
